name: palma_da_mao
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_modular: 6.3.2
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png" 
  adaptive_icon_background: "#FFFFFF"  
  adaptive_icon_foreground: "assets/icon/icon.png"  
  remove_alpha_ios: true  

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Parkinsans
      fonts:
        - asset: assets/fonts/Parkinsans-Light.ttf
          weight: 300
        - asset: assets/fonts/Parkinsans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Parkinsans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Parkinsans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Parkinsans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Parkinsans-ExtraBold.ttf
          weight: 800