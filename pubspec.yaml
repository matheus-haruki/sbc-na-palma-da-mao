name: palma_da_mao
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_modular: 6.3.2
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  flutter_html: ^3.0.0
  flutter_native_splash: ^2.4.8
  lottie: ^3.4.0
  dio: ^5.11.0
  cached_network_image: ^3.4.1
  stomp_dart_client: ^3.0.1
  mask_text_input_formatter: ^2.9.0
  shimmer: ^4.0.0
  intl: ^0.20.3
  pdf: ^3.13.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  printing: ^5.15.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#F8F9FA"
  image: assets/icon/transparent.png 
  android_12:
    color: "#F8F9FA"
    image: assets/icon/transparent.png


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png" 
  adaptive_icon_background: "#FFFFFF"  
  adaptive_icon_foreground: "assets/icon/app_icon.png"  
  remove_alpha_ios: true  

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/data/
    - assets/lottie/
    - assets/image/

  fonts:
    - family: Parkinsans
      fonts:
        - asset: assets/fonts/Parkinsans-Light.ttf
          weight: 300
        - asset: assets/fonts/Parkinsans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Parkinsans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Parkinsans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Parkinsans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Parkinsans-ExtraBold.ttf
          weight: 800